server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${REIMU_SECURE_COOKIE:true}
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.data/reimu;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
reimu:
  mode: ${REIMU_MODE:live}
  model-id: ${REIMU_MODEL_ID:}
  users-json: ${REIMU_USERS_JSON:}
  tenant: ${REIMU_TENANT:local}
  workspace: ${REIMU_WORKSPACE:main}
  origin: ${REIMU_ORIGIN:http://localhost:8080}
  mcp-json: ${REIMU_MCP_JSON:}
